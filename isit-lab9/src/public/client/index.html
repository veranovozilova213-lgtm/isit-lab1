<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доставка заказов</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- ===== Экран 1. Вход в систему ===== -->
    <div id="login-screen" class="container" style="max-width: 400px; margin-top: 50px;">
        <form id="login-form" class="card" novalidate>
            <h1>Вход в систему</h1>

            <label for="login-email">Email</label>
            <input id="login-email" type="text" value="anna@example.com" autocomplete="username">
            <div class="error" id="error-email"></div>

            <label for="login-password">Пароль</label>
            <input id="login-password" type="password" value="123456" autocomplete="current-password">
            <div class="error" id="error-password"></div>

            <div class="error" id="error-login"></div>
            <button type="submit" id="login-button" class="primary">Войти</button>

            <p class="hint">
                Тестовые участники (пароль у всех <code>123456</code>):<br>
                <code>anna@example.com</code> — менеджер (может удалять),<br>
                <code>igor@example.com</code> — курьер (не может удалять),<br>
                <code>maria@example.com</code> — клиент.
            </p>
        </form>
    </div>

    <!-- ===== Экран 2. Список заказов ===== -->
    <div id="main-screen" hidden>
        <div class="topbar">
            <h1 style="margin: 0; font-size: 24px;">Доставка заказов</h1>
            <span>
                <span id="user-name"></span>
                <span id="user-role" class="badge"></span>
                <button id="logout-button">Выйти</button>
            </span>
        </div>

        <div class="container">

            <!-- Форма создания заказа -->
            <form id="task-form" class="card" novalidate>
                <h2>Новый заказ</h2>

                <label for="task-title">Номер заказа</label>
                <input id="task-title" type="text" placeholder="Например: 4657552">
                <div class="error" id="error-title"></div>

                <label for="task-description">Адрес доставки</label>
                <textarea id="task-description" placeholder="Город, улица, дом"></textarea>

                <label for="task-project">Курьер</label>
                <select id="task-project"></select>
                <div class="error" id="error-project"></div>

                <label for="task-priority">Приоритет</label>
                <select id="task-priority">
                    <option value="low">Низкий</option>
                    <option value="medium" selected>Средний</option>
                    <option value="high">Высокий</option>
                </select>

                <label for="task-date">Срок доставки</label>
                <input id="task-date" type="date">
                <div class="error" id="error-date"></div>

                <div class="error" id="error-form"></div>
                <button type="submit" id="task-button" class="primary" style="margin-top: 15px;">Создать заказ</button>
            </form>

            <!-- Фильтры -->
            <h2>Список заказов</h2>
            <div class="toolbar">
                <select id="status-filter">
                    <option value="">Все статусы</option>
                    <option value="new">Новый</option>
                    <option value="in_progress">В пути</option>
                    <option value="done">Доставлен</option>
                </select>
                <input id="search-input" type="text" placeholder="Поиск по номеру...">
                <button id="refresh-button">Обновить</button>
            </div>

            <!-- Здесь показываются «Загрузка…», «Ничего не найдено» и ошибки -->
            <div id="message" class="message" hidden></div>

            <!-- Таблицу заполняет JavaScript -->
            <table id="task-table">
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Заказ</th>
                        <th>Курьер</th>
                        <th>Статус</th>
                        <th>Приоритет</th>
                        <th>Срок</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="task-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Скрипты -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
